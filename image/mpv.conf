# Extra mpv options for kid-tv on the Raspberry Pi. This file is included
# after the built-in options, so anything here overrides them.
#
# Sound goes to the HDMI port the TV is plugged into (detected on every start;
# the headphone jack is disabled in /boot/firmware/config.txt). To force a port:
#   audio-device=alsa/hdmi:CARD=vc4hdmi0,DEV=0   # HDMI 0 (next to the USB-C power)
#   audio-device=alsa/hdmi:CARD=vc4hdmi1,DEV=0   # HDMI 1
# (plughw:CARD=vc4hdmi… does not work: these cards only take IEC958 frames.)
#
# Hardware decoding: 'auto-copy' picks the V4L2 decoders (H.264, HEVC on Pi 4).
# If a file stutters, software decoding can be forced with:
#   hwdec=no
#
# Second HDMI port on a Raspberry Pi 4:
#   drm-connector=HDMI-A-2
