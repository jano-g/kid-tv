# Default ALSA device = sound of the first HDMI port. The vc4-hdmi cards only
# take IEC958 frames, so this goes through ALSA's "hdmi:" device (it wraps them);
# a plain hw/plughw device opens but stays silent. kid-tv itself picks the
# connected HDMI port on every start (kidtv/hdmi.py) and passes it to mpv.
pcm.!default {
    type plug
    slave.pcm "hdmi:CARD=vc4hdmi0,DEV=0"
}
ctl.!default {
    type hw
    card vc4hdmi0
}
