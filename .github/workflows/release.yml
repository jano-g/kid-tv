name: Release

# Publishes a new kid-tv version: runs the tests, builds the app bundle the TV
# downloads for updates (kid-tv-app-vX.Y.Z.tar.gz) and creates the GitHub
# release with the CHANGELOG.md section as its text. Optionally also builds a
# fresh SD card image (45–90 minutes) and attaches it to the same release.
#
# Start it from Actions → Release → Run workflow (version e.g. v0.2.0), or by
# pushing a tag vX.Y.Z (which also builds the image).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. v0.2.0"
        required: true
      image:
        description: "Also build the SD card image (45–90 min)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install mpv and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mpv
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run tests
        run: python -m pytest -q

  app:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the app bundle
        run: |
          scripts/build_bundle.sh "$VERSION" dist
          scripts/release_notes.py "$VERSION" > dist/release-notes.md
          cat dist/release-notes.md
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: kid-tv ${{ env.VERSION }}
          body_path: dist/release-notes.md
          make_latest: true
          files: |
            dist/kid-tv-app-${{ env.VERSION }}.tar.gz
            dist/kid-tv-app-${{ env.VERSION }}.tar.gz.sha256

  image:
    needs: app
    if: inputs.image || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # pi-gen needs ~15 GB of scratch space; the stock runner has too little.
      # (The action's own increase-runner-disk-size option breaks on current
      # runner images, so use the dedicated cleanup action instead.)
      - name: Free disk space on the runner
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Provide a static qemu-aarch64 for the build container
        # pi-gen registers its arm64 binfmt handler from whatever `qemu-aarch64`
        # is in PATH. The action installs the dynamically linked
        # qemu-user-binfmt, which cannot run inside the build container
        # ("arm64: not supported on this machine/kernel"). Put the static
        # binary where the action's symlink expects it. Extracted rather than
        # installed, because qemu-user-static and qemu-user-binfmt conflict.
        run: |
          set -e
          tmp="$(mktemp -d)"
          cd "$tmp"
          sudo apt-get update -qq
          apt-get download qemu-user-static
          dpkg-deb -x qemu-user-static_*.deb extracted
          sudo install -m 0755 extracted/usr/bin/qemu-aarch64-static /usr/bin/qemu-aarch64-static
          sudo ln -sf /usr/bin/qemu-aarch64-static /usr/local/bin/qemu-aarch64
          qemu-aarch64 --version | head -1

      - name: Bundle the source tree into the pi-gen stage
        # The action mounts only the stage directory into the build container.
        run: |
          set -e
          sed -i "s/^__version__ = .*/__version__ = \"${VERSION#v}\"/" kidtv/__init__.py
          mkdir -p image/stage-kidtv/00-install/files/kidtv-src
          rsync -a --delete --exclude '.git' --exclude 'pi-gen' --exclude 'image/stage-kidtv/00-install/files' \
            ./ image/stage-kidtv/00-install/files/kidtv-src/
          chmod +x image/stage-kidtv/prerun.sh image/stage-kidtv/00-install/*.sh image/setup.sh
          du -sh image/stage-kidtv/00-install/files/kidtv-src

      - name: Build image with pi-gen
        id: build
        uses: usimd/pi-gen-action@v1
        with:
          image-name: kid-tv
          # Raspberry Pi OS Trixie (Debian 13). pi-gen master builds only the
          # current release cleanly; bookworm fails on archive keys.
          release: trixie
          pi-gen-version: arm64
          stage-list: stage0 stage1 stage2 ./image/stage-kidtv
          hostname: kid
          # pi-gen refuses to disable the first-boot user rename without a
          # password. SSH is off; the account is only usable at a keyboard.
          username: kidtv
          password: kidtv
          disable-first-boot-user-rename: 1
          enable-ssh: 0
          locale: sk_SK.UTF-8
          keyboard-keymap: sk
          keyboard-layout: Slovak
          enable-cloud-init: 0
          # The action validates time zones against a list without IANA aliases
          # (Europe/Bratislava is an alias of Europe/Prague); image/setup.sh sets
          # Europe/Bratislava inside the image afterwards.
          timezone: Europe/Prague
          wpa-country: SK
          compression: xz
          compression-level: 6
          increase-runner-disk-size: false
          verbose-output: true

      - name: Rename image
        run: |
          set -e
          out="kid-tv-${VERSION}.img.xz"
          mv "${{ steps.build.outputs.image-path }}" "$out"
          sha256sum "$out" > "$out.sha256"

      - name: Attach the image to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: |
            kid-tv-${{ env.VERSION }}.img.xz
            kid-tv-${{ env.VERSION }}.img.xz.sha256
