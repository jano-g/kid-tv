name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install mpv and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mpv
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Render UI previews
        run: python scripts/preview_screens.py previews
      - uses: actions/upload-artifact@v4
        with:
          name: ui-previews
          path: previews/*.png
